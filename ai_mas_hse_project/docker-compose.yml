version: '3.8'

services:
  backend:
    build: ./backend
    container_name: math-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - model-cache:/root/.cache/huggingface
      - ./static_dataset:/app/static_dataset
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: math-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  model-cache: